variables:
  IMAGE_NAME: mp123456789/test-repo
  IMAGE_TAG: python-app-1.0
  DOCKER_TLS_CERTDIR: "/certs"

run_tests:
  image: python:3.12-slim-trixie
  before_script:
    - apt-get update
    - cd backend
    - pip install poetry
    - poetry install
  script:
    - poetry run pytest

build_image:
  image: docker:29.10.0-cli
  services:
    - docker:29.10.0-dind
  before_script:
    - docker login -u $REGISTRY_USER -p $REGISTRY_PASSWORD
  script:
  - docker build -t $IMAGE_NAME:$IMAGE_TAG .
  - docker push $IMAGE_NAME:$IMAGE_TAG