[project]
name = "backend"
version = "0.1.0"
description = ""
authors = [
    {name = "Jan Michel Pfeifer",email = "you@example.com"}
]
requires-python = ">=3.12"
dependencies = [
    "fastapi (>=0.165.0,<0.166.0)",
    "uvicorn[standard] (>=0.54.0,<0.55.0)"
]

[tool.poetry]
package-mode = false

